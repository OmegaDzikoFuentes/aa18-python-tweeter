{% extends 'base.html' %}

{% block main %}
<div class="feed_container">
    {% for tweet in tweets %}
     <div class="tweet">
        <p>{{ tweet.author }} tweeted on {{ tweet.date }} ...</p>
        <p>"{{ tweet.tweet }}"</p>
        <p class="likes {% if tweet.likes > 525000 %}orange{% endif %}">
            Likes: {{ tweet.likes / 1000 }}k
        </p>
        <form action="{{ url_for('like', tweet_id=tweet.id) }}" method="POST">
            <button type="submit">
                {% if tweet.liked %}Unlike{% else %}Like{% endif %}
            </button>
        </form>
     </div>
    {% endfor %}
</div>
{% endblock %}
